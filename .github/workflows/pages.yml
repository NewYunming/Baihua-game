name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检查接口地址变量
        run: |
          if [ -z "${{ vars.SUPABASE_FUNCTION_URL }}" ]; then
            echo "缺少仓库变量 SUPABASE_FUNCTION_URL（形如 https://<ref>.supabase.co/functions/v1/baihua）"
            exit 1
          fi
      - name: 离线测试
        run: |
          node tests/game-logic-smoke.js
          node tests/pvp-sim-smoke.mjs
          node dev/test-function.mjs
      - name: 构建 dist
        run: node scripts/prepare-web-dist.mjs
        env:
          BAIHUA_API_ENTRY: ${{ vars.SUPABASE_FUNCTION_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
